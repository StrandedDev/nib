[package]
name = "nib"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A small, fast, distraction-free terminal text editor"
license = "MIT"
authors = ["StrandedDev"]
repository = "https://github.com/StrandedDev/nib"
readme = "README.md"
keywords = ["editor", "terminal", "tui", "text-editor", "notes"]
categories = ["command-line-utilities", "text-editors"]
publish = false # "nib" is taken on crates.io; install via releases or `cargo install --git`

[dependencies]
anyhow = "1.0.104"
# No image support: keeps the binary small. Wayland support for Linux clipboard.
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
base64 = "0.23.1" # OSC 52 clipboard
crossterm = "0.29.0"
dirs = "7.0.0"
# local time + DST for the title bar mtime (std has no time zones); about 300 KB
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system"] }
# only newline breaks lines; carriage return kept literal
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort" # panic hook still runs first and restores the terminal

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Release packaging (see SPEC §8 and .github/workflows/release.yml). The
# release job passes --output to cargo-deb / cargo-generate-rpm so the file
# names match SPEC §8 exactly.
[package.metadata.deb]
maintainer = "StrandedDev"
copyright = "StrandedDev"
license-file = ["LICENSE", "0"] # becomes /usr/share/doc/nib/copyright
section = "editors"
priority = "optional"
extended-description = """\
nib is a small, fast, distraction-free terminal text editor in the spirit of \
nano: atomic saves, crash recovery, a command palette and Markdown/JSON \
highlighting. Statically linked."""
assets = [
    ["target/release/nib", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/nib/README.md", "644"],
]

[package.metadata.generate-rpm]
summary = "A small, fast, distraction-free terminal text editor"
assets = [
    { source = "target/release/nib", dest = "/usr/bin/nib", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/nib/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/nib/LICENSE", mode = "644" },
]
